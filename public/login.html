<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 桌面端（鼠标设备 pointer:fine）不会被锁成移动版：CSS 里 @media (max-width:760px) 都加了
     and (pointer:coarse) 限定，只有真正的触摸设备（手机/平板）才触发移动版样式。
     桌面浏览器不管窗口多窄，都保持桌面布局，按窗口实际宽度排版，不会出现"超宽缩小"问题。 -->

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png">
<link rel="shortcut icon" href="/favicon.ico">

<!-- iOS Web App -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="知著">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- PWA -->
<meta name="application-name" content="知著 PenMark">
<meta name="theme-color" content="#F7F4EC">
<link rel="manifest" href="/manifest.json">

<title>知著 PenMark</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

<div class="login-card">
  <div class="login-brand" aria-label="知著 PenMark">
    <img src="/PenMark_Brand_Assets/penmark-logo-horizontal-light.svg" alt="" class="login-logo-img brand-logo-light">
    <img src="/PenMark_Brand_Assets/penmark-logo-horizontal-dark.svg" alt="" class="login-logo-img brand-logo-dark">
  </div>

  <div class="login-tabs">
    <button type="button" class="login-tab active" data-tab="login">登录</button>
    <button type="button" class="login-tab" data-tab="register">注册</button>
  </div>

  <!-- 登录 -->
  <form id="loginForm" class="login-pane active" autocomplete="on">
    <div class="login-field">
      <div class="login-field-row">
        <label class="login-label" for="loginUsername">用户名</label>
        <input type="text" id="loginUsername" name="username" autocomplete="username" placeholder="4-20 位字母、数字、下划线" maxlength="20" required>
      </div>
      <div class="field-error" id="loginUsernameError" hidden></div>
    </div>
    <div class="login-field">
      <div class="login-field-row">
        <label class="login-label" for="loginPassword">密码</label>
        <div class="pwd-wrap">
          <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="6-16 位" maxlength="16" required>
          <button type="button" class="pwd-toggle" data-target="loginPassword" tabindex="-1" title="显示/隐藏密码">
            <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-close" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.94 18.94 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="field-error" id="loginPasswordError" hidden></div>
    </div>
    <div id="loginError" class="login-error" hidden></div>
    <button type="submit" class="login-submit" id="loginSubmit">登录</button>
  </form>

  <!-- 注册 -->
  <form id="registerForm" class="login-pane" autocomplete="on">
    <div class="login-field">
      <div class="login-field-row">
        <label class="login-label" for="regUsername">用户名</label>
        <input type="text" id="regUsername" name="username" autocomplete="username" placeholder="4-20 位字母、数字、下划线" maxlength="20" required>
      </div>
      <div class="field-error" id="regUsernameError" hidden></div>
    </div>
    <div class="login-field">
      <div class="login-field-row">
        <label class="login-label" for="regNickname">昵称</label>
        <input type="text" id="regNickname" name="nickname" autocomplete="nickname" placeholder="2-20 个字符" maxlength="20" required>
      </div>
      <div class="field-error" id="regNicknameError" hidden></div>
    </div>
    <div class="login-field">
      <div class="login-field-row">
        <label class="login-label" for="regPassword">密码</label>
        <div class="pwd-wrap">
          <input type="password" id="regPassword" name="password" autocomplete="new-password" placeholder="6-16 位" maxlength="16" required>
          <button type="button" class="pwd-toggle" data-target="regPassword" tabindex="-1" title="显示/隐藏密码">
            <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-close" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.94 18.94 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="field-error" id="regPasswordError" hidden></div>
    </div>
    <div class="login-field">
      <div class="login-field-row">
        <label class="login-label" for="regInvite">邀请码</label>
        <input type="text" id="regInvite" name="invite_code" placeholder="8 位" maxlength="8" required>
      </div>
      <div class="field-error" id="regInviteError" hidden></div>
    </div>
    <div id="regError" class="login-error" hidden></div>
    <button type="submit" class="login-submit" id="regSubmit">注册</button>
  </form>
</div>

<script src="login.js"></script>
</body>
</html>
