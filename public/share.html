<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="知著">
<meta name="application-name" content="知著 PenMark">
<meta name="theme-color" content="#F7F4EC">
<link rel="manifest" href="/manifest.json">

<title>分享文档 知著 PenMark</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="share-page">

<div class="share-progress" id="readingProgress"></div>

<div class="share-topbar">
  <a class="share-brand-mark" href="/" title="知著 PenMark" aria-label="知著 PenMark">
    <img src="/PenMark_Brand_Assets/penmark-logo-horizontal-light.svg" alt="" class="share-brand-logo brand-logo-light">
    <img src="/PenMark_Brand_Assets/penmark-logo-horizontal-dark.svg" alt="" class="share-brand-logo brand-logo-dark">
  </a>
  <div class="share-tools">
    <button class="share-toc-toggle" id="shareTocToggle" type="button" title="章节" aria-label="打开章节" aria-expanded="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><span>章节</span></button>
    <button class="share-theme-toggle" id="themeToggle" title="切换主题" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z"/></svg></button>
    <div class="share-visitors-slot" id="shareVisitorsSlot"></div>
    <a class="share-login-btn" id="shareLoginBtn" href="/login.html" title="登录 / 注册 知著">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      <span class="share-login-label">登录</span>
    </a>
  </div>
</div>

<div class="share-container" id="shareContainer">
  <div class="share-loading-card">加载中…</div>
</div>

<div class="share-reading-dock" id="shareReadingDock" hidden>
  <button class="share-chapter-dock" id="shareChapterDock" type="button" aria-label="&#25171;&#24320;&#31456;&#33410;" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
    <span class="share-chapter-dock-label" id="shareChapterDockLabel">&#31456;&#33410;</span>
  </button>
</div>
<div class="share-toc" id="shareToc" hidden></div>
<div class="share-toc-overlay" id="shareTocOverlay" hidden></div>
<section class="share-toc-sheet" id="shareTocSheet" role="dialog" aria-modal="true" aria-labelledby="shareTocSheetTitle" hidden>
  <div class="share-toc-sheet-head"><strong id="shareTocSheetTitle">章节</strong><button class="share-toc-sheet-close" id="shareTocSheetClose" type="button" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <ol class="share-toc-sheet-list" id="shareTocSheetList"></ol>
</section>

<div class="toast-stack" id="toastStack"></div>

<script type="module" src="/share.js"></script>
</body>
</html>
